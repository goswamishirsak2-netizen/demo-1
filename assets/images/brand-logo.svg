<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d203b"/>
      <stop offset="100%" stop-color="#15325b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b739"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1fb974"/>
      <stop offset="100%" stop-color="#12794b"/>
    </linearGradient>
  </defs>

  <!-- Crest Shield Background -->
  <path d="M 50 8 C 72 8 88 12 88 32 C 88 64 68 84 50 92 C 32 84 12 64 12 32 C 12 12 28 8 50 8 Z" fill="url(#logoBg)" stroke="#f8b739" stroke-width="2"/>
  
  <!-- Laurel Wreath Leaves Left & Right -->
  <path d="M 22 45 C 22 58 32 70 50 78 C 36 72 26 62 26 48 Z" fill="url(#goldGrad)" opacity="0.85"/>
  <path d="M 78 45 C 78 58 68 70 50 78 C 64 72 74 62 74 48 Z" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Rising Sun of Knowledge -->
  <circle cx="50" cy="38" r="14" fill="url(#goldGrad)"/>
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="20" x2="50" y2="16"/>
    <line x1="38" y1="26" x2="35" y2="23"/>
    <line x1="62" y1="26" x2="65" y2="23"/>
    <line x1="32" y1="38" x2="28" y2="38"/>
    <line x1="68" y1="38" x2="72" y2="38"/>
  </g>

  <!-- Blooming Bud / Mukul Leaf -->
  <path d="M 50 25 C 44 32 40 40 40 48 C 45 46 48 40 50 25 Z" fill="url(#greenGrad)"/>
  <path d="M 50 25 C 56 32 60 40 60 48 C 55 46 52 40 50 25 Z" fill="url(#greenGrad)"/>
  <circle cx="50" cy="24" r="3" fill="#ffffff"/>

  <!-- Open Book of Wisdom -->
  <path d="M 30 52 Q 50 56 50 62 Q 50 56 70 52 C 70 58 66 66 50 70 C 34 66 30 58 30 52 Z" fill="#ffffff"/>
  <path d="M 50 62 L 50 70" stroke="#0d203b" stroke-width="1.5"/>

  <!-- Star of Excellence -->
  <polygon points="50,73 51.5,77 56,77 52.5,79.5 54,84 50,81.5 46,84 47.5,79.5 44,77 48.5,77" fill="url(#goldGrad)"/>
</svg>
