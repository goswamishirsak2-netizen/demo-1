<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fc4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#fc4Bg)"/>

  <!-- Soft Child-Safe Turf Floor -->
  <path d="M 0 260 Q 300 240 600 260 L 600 400 L 0 400 Z" fill="#86efac"/>

  <!-- Safe Children's Slide -->
  <g transform="translate(120, 100)">
    <!-- Ladder Steps -->
    <rect x="0" y="0" width="12" height="190" fill="#dc2626"/>
    <line x1="12" y1="40" x2="30" y2="40" stroke="#f87171" stroke-width="4"/>
    <line x1="12" y1="80" x2="30" y2="80" stroke="#f87171" stroke-width="4"/>
    <line x1="12" y1="120" x2="30" y2="120" stroke="#f87171" stroke-width="4"/>
    <line x1="12" y1="160" x2="30" y2="160" stroke="#f87171" stroke-width="4"/>
    <rect x="30" y="0" width="12" height="190" fill="#dc2626"/>

    <!-- Platform -->
    <rect x="35" y="10" width="40" height="12" fill="#f59e0b"/>

    <!-- Slide Chute -->
    <path d="M 70 15 Q 120 40 180 185 L 200 185 Q 140 30 75 10 Z" fill="#3b82f6"/>
  </g>

  <!-- Spring Rocker Toy -->
  <g transform="translate(420, 220)">
    <!-- Spring coil -->
    <path d="M 30 110 L 20 95 L 40 80 L 20 65 L 35 50" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Animal Rider Head (Duck/Horse) -->
    <ellipse cx="30" cy="35" rx="35" ry="20" fill="#facc15"/>
    <circle cx="55" cy="20" r="16" fill="#facc15"/>
    <polygon points="65,22 80,24 68,32" fill="#ea580c"/>
    <circle cx="60" cy="16" r="3" fill="#1e293b"/>
    <!-- Handle -->
    <rect x="42" y="5" width="6" height="16" fill="#ef4444"/>
  </g>
</svg>
