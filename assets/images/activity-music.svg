<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="musBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#musBg)"/>
  
  <!-- Musical Wave Staff -->
  <path d="M 50 140 Q 200 80 350 150 T 550 120" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 50 155 Q 200 95 350 165 T 550 135" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 50 170 Q 200 110 350 180 T 550 150" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 50 185 Q 200 125 350 195 T 550 165" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 50 200 Q 200 140 350 210 T 550 180" stroke="#c084fc" stroke-width="2" fill="none"/>

  <!-- Musical Notes floating -->
  <!-- Treble Clef -->
  <g transform="translate(90, 95) scale(1.3)" fill="#7e22ce">
    <circle cx="16" cy="40" r="8"/>
    <rect x="22" y="10" width="4" height="30"/>
    <path d="M 26 10 Q 40 15 36 28 Q 32 36 24 36" fill="none" stroke="#7e22ce" stroke-width="4"/>
  </g>
  <!-- Beamed Eighth Notes -->
  <g transform="translate(420, 90)">
    <circle cx="20" cy="50" r="10" fill="#a855f7"/>
    <circle cx="60" cy="40" r="10" fill="#a855f7"/>
    <rect x="26" y="10" width="4" height="40" fill="#a855f7"/>
    <rect x="66" y="0" width="4" height="40" fill="#a855f7"/>
    <polygon points="26,10 70,0 70,8 26,18" fill="#a855f7"/>
  </g>

  <!-- Colorful Xylophone -->
  <g transform="translate(140, 240)">
    <!-- Base stand -->
    <polygon points="0,90 320,60 320,80 0,110" fill="#78350f"/>
    <!-- Bars -->
    <rect x="15" y="10" width="30" height="90" rx="4" fill="#ef4444"/>
    <rect x="55" y="15" width="30" height="82" rx="4" fill="#f97316"/>
    <rect x="95" y="20" width="30" height="74" rx="4" fill="#eab308"/>
    <rect x="135" y="25" width="30" height="66" rx="4" fill="#22c55e"/>
    <rect x="175" y="30" width="30" height="58" rx="4" fill="#06b6d4"/>
    <rect x="215" y="35" width="30" height="50" rx="4" fill="#3b82f6"/>
    <rect x="255" y="40" width="30" height="42" rx="4" fill="#a855f7"/>
    <!-- Mallets -->
    <line x1="280" y1="20" x2="350" y2="80" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="280" cy="20" r="10" fill="#ef4444"/>
  </g>

  <!-- Indian Classical Tabla / Dholak Accent -->
  <g transform="translate(460, 260)">
    <ellipse cx="40" cy="30" rx="30" ry="12" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="40" cy="30" rx="14" ry="6" fill="#1e293b"/>
    <path d="M 10 30 Q 15 90 40 90 Q 65 90 70 30" fill="#d97706" stroke="#78350f" stroke-width="2"/>
  </g>
</svg>
