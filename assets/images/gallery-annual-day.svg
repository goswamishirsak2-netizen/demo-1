<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gal1)"/>

  <!-- Stage Lights Spotlights -->
  <polygon points="0,0 200,400 350,400 150,0" fill="#fde047" opacity="0.15"/>
  <polygon points="600,0 400,400 250,400 450,0" fill="#f43f5e" opacity="0.15"/>

  <!-- Red Stage Curtains -->
  <path d="M 0 0 Q 80 180 30 350 L 0 350 Z" fill="#991b1b"/>
  <path d="M 600 0 Q 520 180 570 350 L 600 350 Z" fill="#991b1b"/>
  <path d="M 0 0 Q 300 80 600 0 L 600 40 Q 300 110 0 40 Z" fill="#b91c1c"/>

  <!-- Stage Wooden Floor -->
  <rect x="0" y="320" width="600" height="80" fill="#78350f"/>

  <!-- Little Performers in Stage Costumes -->
  <!-- Performer 1 -->
  <g transform="translate(180, 200)">
    <circle cx="30" cy="30" r="16" fill="#fcd3b2"/>
    <polygon points="10,50 50,50 60,110 0,110" fill="#f59e0b"/>
    <circle cx="30" cy="18" r="8" fill="#f43f5e"/> <!-- Feather crown -->
  </g>
  <!-- Performer 2 (Center) -->
  <g transform="translate(270, 180)">
    <circle cx="30" cy="30" r="18" fill="#fcd3b2"/>
    <polygon points="5,55 55,55 68,130 -8,130" fill="#ec4899"/>
    <!-- Diadem -->
    <polygon points="20,16 30,5 40,16" fill="#fbbf24"/>
  </g>
  <!-- Performer 3 -->
  <g transform="translate(360, 200)">
    <circle cx="30" cy="30" r="16" fill="#fcd3b2"/>
    <polygon points="10,50 50,50 60,110 0,110" fill="#06b6d4"/>
    <circle cx="30" cy="18" r="8" fill="#10b981"/>
  </g>

  <!-- Banner -->
  <text x="300" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#fef08a" text-anchor="middle">Annual Cultural Showcase</text>
</svg>
