<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#stemBg)"/>

  <!-- Microscope (Discovery & Science) -->
  <g transform="translate(130, 90)">
    <!-- Base -->
    <rect x="20" y="220" width="120" height="20" rx="6" fill="#1e293b"/>
    <!-- Pillar -->
    <path d="M 60 220 L 60 130 Q 60 70 120 70 L 140 70" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
    <!-- Eyepiece Tube -->
    <g transform="translate(125, 45) rotate(35)">
      <rect x="0" y="0" width="22" height="90" rx="4" fill="#3b82f6"/>
      <rect x="-4" y="-8" width="30" height="12" rx="3" fill="#1d4ed8"/>
      <!-- Objective Lens -->
      <polygon points="2,90 20,90 16,110 6,110" fill="#f59e0b"/>
    </g>
    <!-- Stage -->
    <rect x="80" y="155" width="80" height="10" rx="2" fill="#0f172a"/>
    <!-- Light source -->
    <circle cx="100" cy="195" r="12" fill="#facc15"/>
  </g>

  <!-- Chemistry Flasks with Bubbling Colorful Liquids -->
  <g transform="translate(360, 160)">
    <!-- Erlenmeyer Flask -->
    <polygon points="40,20 60,20 85,120 15,120" fill="none" stroke="#0f172a" stroke-width="4"/>
    <polygon points="36,45 64,45 80,116 20,116" fill="#10b981" opacity="0.85"/>
    <rect x="36" y="14" width="28" height="8" rx="2" fill="#0f172a"/>
    <!-- Bubbles -->
    <circle cx="50" cy="70" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="42" cy="90" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="62" cy="85" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="50" cy="30" r="4" fill="#10b981"/>
    <circle cx="58" cy="10" r="3" fill="#10b981"/>
  </g>

  <!-- Big Magnifying Glass -->
  <g transform="translate(420, 90) rotate(25)">
    <circle cx="50" cy="50" r="35" fill="#ffffff" opacity="0.6" stroke="#f59e0b" stroke-width="6"/>
    <line x1="75" y1="75" x2="120" y2="120" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <!-- Insect / Leaf under lens -->
    <path d="M 40 45 Q 50 35 60 45 Q 65 55 50 60 Z" fill="#22c55e"/>
  </g>

  <!-- Geometric & Robotic Cog Gear -->
  <g transform="translate(80, 70)">
    <circle cx="40" cy="40" r="22" fill="#f97316"/>
    <circle cx="40" cy="40" r="10" fill="#eff6ff"/>
  </g>
</svg>
