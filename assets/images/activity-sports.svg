<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#spoBg)"/>

  <!-- Sports Ground Field Markings -->
  <ellipse cx="300" cy="320" rx="260" ry="60" fill="#a7f3d0"/>
  <ellipse cx="300" cy="320" rx="180" ry="40" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Football / Soccer Ball -->
  <g transform="translate(180, 240)">
    <circle cx="40" cy="40" r="36" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="40,24 54,34 49,50 31,50 26,34" fill="#0f172a"/>
    <line x1="40" y1="24" x2="40" y2="4" stroke="#0f172a" stroke-width="2"/>
    <line x1="54" y1="34" x2="72" y2="28" stroke="#0f172a" stroke-width="2"/>
    <line x1="49" y1="50" x2="62" y2="68" stroke="#0f172a" stroke-width="2"/>
    <line x1="31" y1="50" x2="18" y2="68" stroke="#0f172a" stroke-width="2"/>
    <line x1="26" y1="34" x2="8" y2="28" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Cricket Bat & Ball (Popular Indian School Activity) -->
  <g transform="translate(320, 140) rotate(-25)">
    <rect x="0" y="80" width="30" height="130" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <rect x="10" y="20" width="10" height="65" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="7" y="10" width="16" height="12" rx="3" fill="#ef4444"/>
    <!-- Red Cricket Ball -->
    <circle cx="65" cy="180" r="16" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <path d="M 52 180 Q 65 170 78 180" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
  </g>

  <!-- Golden Champion Trophy -->
  <g transform="translate(420, 110)">
    <path d="M 20 20 L 70 20 L 60 70 Q 45 90 45 110 L 45 130 L 70 130 L 70 145 L 20 145 L 20 130 L 45 130" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <!-- Handles -->
    <path d="M 20 30 Q 0 45 20 60" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 70 30 Q 90 45 70 60" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Star on Trophy -->
    <polygon points="45,45 47,51 53,51 48,55 50,61 45,57 40,61 42,55 37,51 43,51" fill="#ffffff"/>
  </g>

  <!-- Agility Cones -->
  <polygon points="120,290 105,330 135,330" fill="#f97316"/>
  <polygon points="460,280 445,320 475,320" fill="#f97316"/>
</svg>
