<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gal5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gal5)"/>

  <!-- Cultural Floral Rangoli / Alpana Pattern (Kolkata Tradition) -->
  <g transform="translate(300, 200)" stroke="#d97706" stroke-width="2.5" fill="none">
    <circle cx="0" cy="0" r="100"/>
    <circle cx="0" cy="0" r="70"/>
    <circle cx="0" cy="0" r="40"/>
    <!-- Lotus Petals -->
    <path d="M 0 -100 Q 30 -60 0 -40 Q -30 -60 0 -100 Z" fill="#fde68a"/>
    <path d="M 100 0 Q 60 30 40 0 Q 60 -30 100 0 Z" fill="#fde68a"/>
    <path d="M 0 100 Q 30 60 0 40 Q -30 60 0 100 Z" fill="#fde68a"/>
    <path d="M -100 0 Q -60 30 -40 0 Q -60 -30 -100 0 Z" fill="#fde68a"/>
    <!-- Ektara / Musical Instrument Symbol -->
    <circle cx="0" cy="0" r="18" fill="#d97706"/>
  </g>

  <!-- Tag & Text Header -->
  <text x="300" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#92400e" text-anchor="middle">Rabindra Jayanti & Baisakhi Utsav</text>
  <text x="300" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">Celebrating Cultural Heritage at Belgharia</text>
</svg>
