<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fc1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#fc1Bg)"/>

  <!-- Smart Digital Touch Display Board -->
  <rect x="80" y="40" width="440" height="230" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
  <rect x="95" y="55" width="410" height="200" rx="6" fill="#0c4a6e"/>

  <!-- Audio-Visual Content on Smart Board -->
  <circle cx="200" cy="150" r="45" fill="#f59e0b"/>
  <circle cx="280" cy="130" r="25" fill="#10b981"/>
  <circle cx="340" cy="165" r="35" fill="#ec4899"/>
  <text x="300" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Interactive Audio-Visual Learning</text>

  <!-- Modern Ergonomic Child Class Desks -->
  <g transform="translate(100, 270)">
    <rect x="0" y="20" width="180" height="15" rx="4" fill="#f8fafc"/>
    <rect x="20" y="35" width="10" height="65" fill="#94a3b8"/>
    <rect x="150" y="35" width="10" height="65" fill="#94a3b8"/>
    <!-- Cute Chairs -->
    <rect x="40" y="0" width="45" height="45" rx="6" fill="#3b82f6"/>
    <rect x="100" y="0" width="45" height="45" rx="6" fill="#10b981"/>
  </g>

  <g transform="translate(320, 270)">
    <rect x="0" y="20" width="180" height="15" rx="4" fill="#f8fafc"/>
    <rect x="20" y="35" width="10" height="65" fill="#94a3b8"/>
    <rect x="150" y="35" width="10" height="65" fill="#94a3b8"/>
    <rect x="40" y="0" width="45" height="45" rx="6" fill="#f59e0b"/>
    <rect x="100" y="0" width="45" height="45" rx="6" fill="#ec4899"/>
  </g>
</svg>
